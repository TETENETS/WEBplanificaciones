# Entorno local completo: app + PostGIS.  docker compose up --build
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: fttx
      POSTGRES_PASSWORD: fttx
      POSTGRES_DB: fttx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fttx -d fttx"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://fttx:fttx@db:5432/fttx
      SEED_DEMO: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
